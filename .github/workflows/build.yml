name: Build RIWAYA APK
on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # To publish each build's APK as a release (a direct download link)
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1
        with:
          cache-read-only: false

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' -A3 build.log | head -n 150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3

      - name: Check the APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            for f in app/build/outputs/apk/debug/*.apk; do
              echo "== $(basename "$f") $(stat -c %s "$f") bytes"
              "$BT"/apksigner verify --print-certs "$f" 2>&1 | grep -E "Signer #1 certificate DN|ERROR" | head -3
              "$BT"/aapt2 dump badging "$f" 2>&1 | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion|^native-code" | head -6
            done
          } 2>&1 | tee apkcheck.txt
          { echo '## APKs'; echo '```'; cat apkcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: RIWAYA-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 14

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest 2>&1 | tail -n 40

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="riwaya-build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "RIWAYA-${{ github.run_number }}-arm64.apk"
          cp app/build/outputs/apk/debug/app-universal-debug.apk "RIWAYA-${{ github.run_number }}-universal.apk"
          gh release create "$tag" "RIWAYA-${{ github.run_number }}-arm64.apk" "RIWAYA-${{ github.run_number }}-universal.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "RIWAYA build ${{ github.run_number }}" \
            --notes "Branch ${{ github.ref_name }}, commit ${{ github.sha }}"
          {
            echo '## Download'
            echo "https://github.com/${{ github.repository }}/releases/download/$tag/RIWAYA-${{ github.run_number }}-arm64.apk"
            echo "https://github.com/${{ github.repository }}/releases/download/$tag/RIWAYA-${{ github.run_number }}-universal.apk"
          } >> "$GITHUB_STEP_SUMMARY"
